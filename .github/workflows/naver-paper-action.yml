name: Naver Paper Auto Collection

on:
  schedule:
    # 매일 0, 6, 12, 18시 (UTC 기준) -> 한국 시간 09, 15, 21, 03시
    # GitHub Actions의 스케줄 정확도는 보장되지 않으므로(지연 가능) 대략적인 시간으로 설정
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:  # 수동 실행 가능하도록 설정

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: read  # 코드 읽기 권한

    steps:
    # 1. 저장소 코드 가져오기
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Python 설정
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Timezone 설정 (한국 시간)
    - name: Set Timezone
      uses: szenius/set-timezone@v1.2
      with:
        timezoneLinux: "Asia/Seoul"

    # 4. 의존성 패키지 설치
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install playwright
        playwright install chromium

    # 5. 쿠키 파일 복원 (Secrets -> json file)
    - name: Restore Cookies
      env:
        NAVER_ID: ${{ secrets.NAVER_ID }}
        COOKIE_JSON_GOODMAN6999: ${{ secrets.COOKIE_JSON_GOODMAN6999 }}
      run: python restore_cookies_from_env.py

    # 6. 스크립트 실행
    - name: Run Naver Paper Script
      env:
        # config.py가 이 환경변수들을 읽어서 사용함
        NAVER_ID: ${{ secrets.NAVER_ID }}
        NAVER_PW: ${{ secrets.NAVER_PW }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        NO_PAPER_ALARM: "True"
        LOG_TO_FILE: "False"  # GitHub 로그로 확인하면 되므로 파일 저장 불필요
      run: python get_paper.py
