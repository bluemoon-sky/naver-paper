name: Naver Paper Auto Collection

on:
  schedule:
    # NAS 설정(app.cron)과 동일하게 매 시간 50분에 실행
    - cron: '50 * * * *'
  workflow_dispatch:  # 수동 실행 가능하도록 설정

jobs:
  run-script:
    runs-on: ubuntu-latest

    permissions:
      contents: read  # 코드 읽기 권한

    steps:
    # 1. 저장소 코드 가져오기
    - name: Checkout code
      uses: actions/checkout@v3

    # 2. Python 설정
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Timezone 설정 (한국 시간)
    - name: Set Timezone
      uses: szenius/set-timezone@v1.2
      with:
        timezoneLinux: "Asia/Seoul"

    # 4. 의존성 패키지 설치
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install playwright
        playwright install chromium

    # [디버그용] Secrets 주입 확인 (안전한 방식)
    - name: Debug Secrets
      env:
        DEBUG_ID: ${{ secrets.MY_NAVER_ID }}
        DEBUG_PW: ${{ secrets.MY_NAVER_PW }}
        DEBUG_COOKIE: ${{ secrets.COOKIE_JSON_GOODMAN6999 }}
      run: |
        echo "Check MY_NAVER_ID..."
        if [ -z "$DEBUG_ID" ]; then
          echo "❌ MY_NAVER_ID is EMPTY! Check GitHub Secrets."
        else
          echo "✅ MY_NAVER_ID is SET (Value: $DEBUG_ID)"
        fi
        
        echo "Check MY_NAVER_PW..."
        if [ -z "$DEBUG_PW" ]; then
          echo "❌ MY_NAVER_PW is EMPTY! Check GitHub Secrets."
        else
          echo "✅ MY_NAVER_PW is SET (Value is masked)"
        fi
        
        echo "Check COOKIE_JSON..."
        if [ -z "$DEBUG_COOKIE" ]; then
           echo "❌ COOKIE_JSON_GOODMAN6999 is EMPTY!"
        else
           echo "✅ COOKIE_JSON_GOODMAN6999 is SET (Length: ${#DEBUG_COOKIE})"
           if [ ${#DEBUG_COOKIE} -lt 200 ]; then
             echo "⚠️ WARNING: Cookie JSON seems too short! (Length: ${#DEBUG_COOKIE}). Did you paste the content correctly?"
           fi
        fi

    # 5. 쿠키 파일 복원 (Secrets -> json file)
    - name: Restore Cookies
      env:
        NAVER_ID: ${{ secrets.MY_NAVER_ID }}
        COOKIE_JSON_GOODMAN6999: ${{ secrets.COOKIE_JSON_GOODMAN6999 }}
      run: python restore_cookies_from_env.py

    # 6. 스크립트 실행
    - name: Run Naver Paper Script
      env:
        # config.py가 이 환경변수들을 읽어서 사용함
        NAVER_ID: ${{ secrets.MY_NAVER_ID }}
        NAVER_PW: ${{ secrets.MY_NAVER_PW }}
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        NO_PAPER_ALARM: "False"
        LOG_TO_FILE: "False"  # GitHub 로그로 확인하면 되므로 파일 저장 불필요
      run: python get_paper.py
